; SkyWatch ESP32 firmware (ADR-0007). Adjust `board` to your module.
; Default profile targets an ESP32-C3 round-display module similar to the
; hackster "Micro Radar" build.
;
; Serial output builds out of the box. To enable the round-display radar, add
; `-DUSE_TFT` to build_flags AND provide a TFT_eSPI User_Setup for your panel
; (e.g. the GC9A01 240x240 round display).

[platformio]
default_envs = esp32c3

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    https://github.com/tzapu/WiFiManager.git
    bodmer/TFT_eSPI@^2.5.43

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; -DUSE_TFT            ; uncomment + add a TFT_eSPI User_Setup to enable the display

; Generic ESP32 dev board fallback (e.g. WROOM-32 + external TFT)
[env:esp32dev]
platform = espressif32
board = esp32dev
