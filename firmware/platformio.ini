; SkyWatch ESP32 firmware (ADR-0007). Scaffold — adjust `board` to your module.
; Default profile targets an ESP32-C3 round-display module similar to the
; hackster "Micro Radar" build.

[platformio]
default_envs = esp32c3

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    https://github.com/tzapu/WiFiManager.git
    bodmer/TFT_eSPI@^2.5.43

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Generic ESP32 dev board fallback (e.g. WROOM-32 + external TFT)
[env:esp32dev]
platform = espressif32
board = esp32dev
