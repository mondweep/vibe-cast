name: NE India Pulse CI

# CI for the ne-india-pulse project: lint + London-School test suite + Docker
# build. CD to Cloud Run (keyless WIF, ADR-0002) is added once the GCP project
# + Workload Identity Federation are provisioned out-of-band by the owner.
on:
  push:
    branches: ["claude/cool-fermat-vcyuyd"]
    paths: ["ne-india-pulse/**", ".github/workflows/ne-india-pulse-ci.yml"]
  pull_request:
    paths: ["ne-india-pulse/**", ".github/workflows/ne-india-pulse-ci.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: ne-india-pulse

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (with dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Unit + contract + acceptance tests (offline, mocked GDELT)
        run: pytest --cov=ne_pulse --cov-report=term-missing

      - name: Validate Phase-0 artifacts present
        run: |
          set -e
          for f in docs/prd/PRD.md docs/PROJECT-PLAN.md \
                   docs/adr/0001-ruflo-swarm-orchestration.md \
                   docs/research/03-todays-snapshot.md \
                   scripts/ne_pulse_snapshot.py Dockerfile; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (smoke)
        run: docker build -t ne-india-pulse:ci ne-india-pulse
      - name: Container starts & serves /healthz
        run: |
          docker run -d --name pulse -p 8080:8080 ne-india-pulse:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/healthz; then echo " OK"; exit 0; fi
            sleep 2
          done
          echo "::error::container did not become healthy"; docker logs pulse; exit 1

  # deploy:  # enabled after WIF setup (ADR-0002)
