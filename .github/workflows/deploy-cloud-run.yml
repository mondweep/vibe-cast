name: Deploy (Cloud Run)

# Keyless deploy via Workload Identity Federation — no service-account keys are
# stored in GitHub. One-time setup: run scripts/gcp-bootstrap-wif.sh and set the
# four repo Variables it prints (see docs/DEPLOY-CICD.md).

on:
  push:
    branches: [aircraft-tracking]
    paths:
      - 'services/gateway/**'
      - '.github/workflows/deploy-cloud-run.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required to mint the OIDC token for WIF

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip cleanly until the GCP variables have been configured.
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    env:
      SERVICE: skywatch-gateway
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/skywatch/gateway:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & push image to Artifact Registry
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" services/gateway
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        env:
          # Optional OpenSky OAuth2 (set these repo Variables to enable; without
          # them the gateway calls OpenSky anonymously with stricter limits).
          OPENSKY_CLIENT_ID: ${{ vars.OPENSKY_CLIENT_ID }}
          OPENSKY_SECRET_NAME: ${{ vars.GCP_OPENSKY_SECRET }} # Secret Manager name
          # Optional shared-token guard: name of a Secret Manager secret holding
          # API_TOKEN. When set, GET /sky requires the token (team-only URL).
          API_TOKEN_SECRET: ${{ vars.GCP_API_TOKEN_SECRET }}
        run: |
          # Pipe-delimited (^|^) so NODE_OPTIONS can contain '='. NODE_OPTIONS
          # forces IPv4-first DNS, without which Node's fetch fails on Cloud Run.
          # FLIGHT_SOURCE=adsblol because OpenSky blocks datacenter IPs.
          ENV_VARS="OBSERVER_LAT=51.5074|OBSERVER_LON=-0.1278|OBSERVER_ALT_KM=0.03|FLIGHT_RANGE_KM=50|MIN_ELEVATION_DEG=10|SATELLITE_GROUP=visual|PASS_WINDOW_HOURS=6|CACHE_TTL_MS=30000|FLIGHT_SOURCE=adsblol|NODE_OPTIONS=--dns-result-order=ipv4first"
          SECRET_ARGS=()
          if [[ -n "$OPENSKY_CLIENT_ID" && -n "$OPENSKY_SECRET_NAME" ]]; then
            echo "OpenSky OAuth2 enabled (client id + Secret Manager secret)."
            ENV_VARS="${ENV_VARS}|OPENSKY_CLIENT_ID=${OPENSKY_CLIENT_ID}"
            SECRET_ARGS+=(--update-secrets "OPENSKY_CLIENT_SECRET=${OPENSKY_SECRET_NAME}:latest")
          else
            echo "OpenSky credentials not configured — using the adsb.lol feed."
          fi
          if [[ -n "$API_TOKEN_SECRET" ]]; then
            echo "Shared-token guard enabled — /sky will require the token."
            SECRET_ARGS+=(--update-secrets "API_TOKEN=${API_TOKEN_SECRET}:latest")
          fi
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated \
            --min-instances=1 --max-instances=3 \
            --cpu=1 --memory=512Mi --cpu-boost \
            --timeout=120 --concurrency=80 \
            --set-env-vars="^|^${ENV_VARS}" \
            "${SECRET_ARGS[@]}"

      - name: Output service URL
        run: |
          echo "Deployed: $(gcloud run services describe "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" --format='value(status.url)')" >> "$GITHUB_STEP_SUMMARY"
