# course-platform-init — input config
# Copy to config.yaml, fill in, then invoke the skill.
# This drives NAMING and STRUCTURE. Content comes from course-material/.

mode: bootstrap            # "bootstrap" (new platform) | "add-course" (existing platform)

project:
  name: "math-mastery"            # repo / product name (kebab-case)
  display_name: "Math Mastery"    # human-facing title
  org: "your-github-org"          # GitHub org or user
  problem_statement: >            # one paragraph: who, what pain, why now, success
    Learners preparing for quantitative interviews lack a structured, interactive
    path from fundamentals to advanced topics with AI-guided support. Success =
    a learner completes a path and earns a verifiable badge.

branches:
  primary: "main"                 # protected, stable
  development: "course-build"     # active dev branch (created if missing)
  feature_prefix: "claude/"       # auto-named agent/feature branches

stack:                            # used for the guide + Dockerfile; bootstrap only
  frontend: "React 18 + Vite"
  backend: "Fastify + Node.js 20"
  database: "Supabase (PostgreSQL)"
  test_framework: "Vitest + React Testing Library"
  deploy_target: "cloud-run"      # cloud-run | railway | vercel

database:
  table_prefix: "ruflo_demo_"     # MUST match existing tables in add-course mode
  rls: true                       # enable Row Level Security on every new table

methodology:                      # informational; appears in the generated guide
  - "DDD (Domain-Driven Design)"
  - "CQRS + Event Sourcing"
  - "TDD (Test-Driven Development)"
  - "Swarm AI orchestration (Ruflo / claude-flow)"

# Bounded contexts to scaffold (bootstrap) or reference (add-course).
# Omit domains you don't need — the skill only scaffolds what's listed.
domains:
  - name: "Learning"
    bounded_context: "Paths, Lessons, Enrollment, Progress"
  - name: "Certification"
    bounded_context: "Badges, Exams, Certificates"
  - name: "SkillLab"
    bounded_context: "Exercises, Lab Sessions"
  - name: "Community"
    bounded_context: "Members, Discussions, Patterns"
  - name: "Metrics"
    bounded_context: "Analytics, Leaderboard"

course:                           # metadata for THIS run's course material
  slug: "linear-algebra"          # used in migration filename + seed keys
  title: "Linear Algebra Foundations"
  level: "beginner"               # beginner | intermediate | advanced

# Knowledge Graph — the CONTENT ENGINE (see references/knowledge-graph.md).
# When enabled, author/extend the KG FIRST, then generate lessons FROM it
# (cite-or-refuse: every lesson claim must map to a verified, cited node).
knowledge_graph:
  enabled: true
  ground_truth: "https://github.com/your-org/source-of-truth"  # repo/material the graph cites
  # Domain-specific taxonomies — derive from your syllabus nouns. Table shape is fixed.
  node_kinds: ["concept", "term", "technique", "example", "definition"]
  edge_relations: ["prerequisite_of", "teaches", "part_of", "depends_on", "related_to", "example_of"]
  embedding:
    model: "Xenova/all-MiniLM-L6-v2"   # local ONNX, no API key
    dims: 384                          # index-time == query-time, or retrieval degrades
  # Tiered model routing for the build pipeline:
  model_routing:
    author_nodes_edges: "opus"         # judgment-heavy, done once
    generate_lessons: "sonnet"         # assembles prose from verified nodes
    embed_and_glue: "haiku"            # mechanical

# AI Tutor — GraphRAG over the knowledge graph (POST /api/v1/tutor/ask).
ai_tutor:
  enabled: true
  retrieve_top_k: 8
  score_floor: 0.3                     # below this -> refuse (anti-hallucination)
  graph_hops: 1                        # neighbourhood expansion for context
  # Bring-your-own-key: provider+key from the request OR server env; never persisted/logged.
  providers: ["anthropic", "openai", "requesty", "gemini"]
  default_model: "claude-sonnet-4-6"

# Where the raw content lives (relative to repo root).
course_material_dir: "course-material/"
