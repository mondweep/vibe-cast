steps:
  # Build backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/navier-stokes-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend/'
    id: 'build-backend'

  # Push backend image to GCR
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/navier-stokes-backend:latest'
    id: 'push-backend'

  # Deploy backend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'navier-stokes-backend'
      - '--image=gcr.io/$PROJECT_ID/navier-stokes-backend:latest'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--set-env-vars=NODE_ENV=production'
    env:
      - 'CLOUDSDK_COMPUTE_REGION=us-central1'
    id: 'deploy-backend'
    waitFor: ['push-backend']

  # Build frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/navier-stokes-frontend:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - 'frontend/'
    id: 'build-frontend'
    waitFor: ['deploy-backend']

  # Push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/navier-stokes-frontend:latest'
    id: 'push-frontend'

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'navier-stokes-frontend'
      - '--image=gcr.io/$PROJECT_ID/navier-stokes-frontend:latest'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
    env:
      - 'CLOUDSDK_COMPUTE_REGION=us-central1'
    id: 'deploy-frontend'
    waitFor: ['push-frontend']

images:
  - 'gcr.io/$PROJECT_ID/navier-stokes-backend:latest'
  - 'gcr.io/$PROJECT_ID/navier-stokes-frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: N1_HIGHCPU_8
