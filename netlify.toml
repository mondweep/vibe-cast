# Netlify: serve the pre-built static site in web/.
#
# The site is generated by `python3 web/build.py`, which runs each demo and
# captures its real output. Netlify's build image has no Rust toolchain and
# no QEMU, so we do NOT regenerate on deploy -- web/index.html is committed
# and published as-is. Regenerate locally and commit when demos change.
[build]
  publish = "web"
  command = "echo 'Publishing pre-built site from web/'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
